version: '3.8'

services:
  # Serviço da aplicação ASP.NET Core
  app:
    image: inclusao-diversidade-dotnet:latest
    container_name: app-inclusao-diversidade
    build:
      context: ./Fiap.Api.InclusaoDiversidadeEmpresas
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db
      - DB_PORT=1521
      - DB_NAME=ORCL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inclusao-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço do banco de dados Oracle
  # ATENÇÃO: requer login na Oracle Container Registry antes do primeiro pull
  # Execute: docker login container-registry.oracle.com
  # Aceite os termos em: https://container-registry.oracle.com
  db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: db-inclusao-diversidade
    environment:
      # Correção: senha movida para o .env, não exposta no compose
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - inclusao-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

# Rede interna para comunicação entre serviços
networks:
  inclusao-network:
    driver: bridge

# Volumes nomeados para persistência de dados
volumes:
  oracle-data:
    driver: local